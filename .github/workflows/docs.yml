name: Documentation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    # Check all PR
  schedule:
    - cron: '0 8 * * 1' # run every Monday at 8am UTC
  # manual runs, which also update the download cache
  workflow_dispatch:

env:
  # Packages, models and datasets downloaded while running the examples are
  # stored in a cache shared by all examples (see src/ci-cache.py), and files
  # are removed from the cache this many days after being downloaded. The
  # cache can be reset by editing .github/download-cache-version, or cleared
  # with the clear-download-cache.yml workflow.
  DOWNLOAD_CACHE_MAX_AGE_DAYS: 10
  # Packages are always cached, but files downloaded by the examples themselves
  # (models, datasets) are only cached if they are smaller than this
  DOWNLOAD_CACHE_MAX_FILE_SIZE_MB: 150
  # The largest files are removed if the cache gets bigger than this, to stay
  # below the 10 GB of cache storage of the repository
  DOWNLOAD_CACHE_MAX_SIZE_GB: 8

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      examplesmatrix: ${{ steps.gatherInfo.outputs.examplesjson }}
      latest_docs_run: ${{ steps.gatherInfo.outputs.latest_docs_run }}
    permissions: read-all # Permissions for the GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v6
        with:
          # The checkout by default doesn't fetch any history, but for PR
          # we want to check which files have been modified.
          # The action actions/checkout@v6 squashes the history of the PR,
          # into a single commit so we need to fetch with a depth of 2.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - id: gatherInfo
        # Collect the examples that need to be run, and the id of the latest
        # workflow run on the main branch.
        run: |
          GET_EXAMPLES_ARGS=""
          if ${{ github.event_name == 'pull_request' }}; then
            GET_EXAMPLES_ARGS=" --modified-files $(git diff --name-only -r HEAD^1 HEAD)"
          fi
          echo examplesjson=$(./src/get_examples.py ${GET_EXAMPLES_ARGS}) >> $GITHUB_OUTPUT
          echo latest_docs_run=$(./src/latest_docs_run.py id --api-token ${{ secrets.GITHUB_TOKEN }}) >> $GITHUB_OUTPUT

  generate-example:
    needs: setup
    runs-on: ubuntu-latest
    # Handle the case where there are no examples to run.
    if: ${{ needs.setup.outputs.examplesmatrix != ''}}
    strategy:
      fail-fast: false
      matrix:
        ${{ fromJson(needs.setup.outputs.examplesmatrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: configure the download cache
        run: |
          echo "CONDA_PKGS_DIRS=$HOME/cookbook-cache/conda" >> $GITHUB_ENV
          # pip, huggingface_hub, shiftml, ... store their files here
          echo "XDG_CACHE_HOME=$HOME/cookbook-cache/xdg" >> $GITHUB_ENV
          # used by atomistic_cookbook_utils.download_with_retry
          echo "ATOMISTIC_COOKBOOK_CACHE=$HOME/cookbook-cache/downloads" >> $GITHUB_ENV
          echo "DOWNLOAD_CACHE_PREFIX=cookbook-downloads-${{ hashFiles('.github/download-cache-version') }}-" >> $GITHUB_ENV

      - name: restore the download cache
        uses: actions/cache/restore@v6
        with:
          path: ~/cookbook-cache
          # never matches exactly: restores the latest cache with the prefix, from
          # this branch or from main
          key: ${{ env.DOWNLOAD_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.DOWNLOAD_CACHE_PREFIX }}

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: remove outdated files from the download cache
        run: |
          python src/ci-cache.py prune --root ~/cookbook-cache \
            --max-age-days ${{ env.DOWNLOAD_CACHE_MAX_AGE_DAYS }} \
            --max-file-size-mb ${{ env.DOWNLOAD_CACHE_MAX_FILE_SIZE_MB }} \
            --marker ~/cookbook-cache.marker

      - name: install dependencies
        run: python -m pip install -r requirements.txt

      - name: setup conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: false

      - name: build example
        timeout-minutes: 12
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          conda config --set notify_outdated_conda false
          conda config --show pkgs_dirs
          nox -e ${{ matrix.example-name }} -- --no-website

      - name: check that the build did not create additional files in git
        run: |
          untracked="$(git ls-files --exclude-standard --others)"
          if [ -n "$untracked" ]; then
            printf >&2 "Error: running the example created untracked files:\n%s\n" "$untracked"
            exit 1
          fi

      - name: check that the build did not create files in data/
        run: |
          # everything in data/ ends up in the downloadable zip, so runtime
          # files (even gitignored ones) should be written to tmp/ instead
          created="$(git ls-files --others -- "examples/${{ matrix.example-name }}/data" ':!:**/__pycache__/**')"
          if [ -n "$created" ]; then
            printf >&2 "Error: running the example created files in data/, write them to tmp/ instead:\n%s\n" "$created"
            exit 1
          fi

      - name: store example as a github artifact
        uses: actions/upload-artifact@v6
        with:
          name: example-${{ matrix.example-name }}
          path: docs/src/examples/*  # folders for each example will be merged later
          overwrite: true  # only keep the latest version of the example

      # Runs on main and on manual runs (PRs read the cache of main, but a cache
      # saved by a PR is only visible to that PR). Each example uploads the files
      # it added to the download cache, and the update-download-cache job merges
      # them. Files downloaded by a failed example are uploaded too.
      - name: archive the files added to the download cache
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
        run: |
          python src/ci-cache.py collect --root ~/cookbook-cache \
            --max-file-size-mb ${{ env.DOWNLOAD_CACHE_MAX_FILE_SIZE_MB }} \
            --marker ~/cookbook-cache.marker --output ~/cache-delta/cache-delta.tar

      - name: upload the files added to the download cache
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v6
        with:
          name: cache-delta-${{ matrix.example-name }}
          path: ~/cache-delta/cache-delta.tar
          retention-days: 1
          compression-level: 0  # the content is already compressed
          if-no-files-found: ignore

  update-download-cache:
    # Merges the files downloaded by all the examples into a new download cache,
    # and deletes the other caches of this branch
    needs: generate-example
    if: ${{ always() && needs.generate-example.result != 'skipped' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # to delete caches
      contents: read
    concurrency:
      # concurrent runs update the cache one at a time
      group: update-download-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: configure the download cache
        run: |
          echo "DOWNLOAD_CACHE_PREFIX=cookbook-downloads-${{ hashFiles('.github/download-cache-version') }}-" >> $GITHUB_ENV

      - name: restore the download cache
        uses: actions/cache/restore@v6
        with:
          path: ~/cookbook-cache
          key: ${{ env.DOWNLOAD_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: ${{ env.DOWNLOAD_CACHE_PREFIX }}

      - name: download the files added by each example
        uses: actions/download-artifact@v7
        with:
          pattern: cache-delta-*
          path: ~/cache-deltas

      - name: update the download cache
        id: update
        run: |
          python src/ci-cache.py merge --root ~/cookbook-cache ~/cache-deltas
          python src/ci-cache.py prune --root ~/cookbook-cache \
            --max-age-days ${{ env.DOWNLOAD_CACHE_MAX_AGE_DAYS }} \
            --max-file-size-mb ${{ env.DOWNLOAD_CACHE_MAX_FILE_SIZE_MB }} \
            --max-size-gb ${{ env.DOWNLOAD_CACHE_MAX_SIZE_GB }} \
            --summary

      - name: save the download cache
        if: ${{ steps.update.outputs.merged == 'true' || steps.update.outputs.pruned == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/cookbook-cache
          key: ${{ env.DOWNLOAD_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: delete the previous download caches
        if: ${{ steps.update.outputs.merged == 'true' || steps.update.outputs.pruned == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_KEY: ${{ env.DOWNLOAD_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # every cache of this branch except the new one, whatever the hash of
          # .github/download-cache-version in their key
          gh cache list --ref "${{ github.ref }}" --key cookbook-downloads- \
            --limit 100 --json id,key --jq ".[] | select(.key != \"$NEW_KEY\") | .id" \
            | xargs -r -n1 gh cache delete

  build-and-publish:
    # Run this job even if the generate-example job was skipped due to
    # no examples to run. I.e. only avoid if generate-example failed.
    if: ${{ always() && needs.generate-example.result != 'failure' }}
    # Permissions for the GITHUB_TOKEN (does not affect GH_DEPLOY_TOKEN)
    permissions: read-all
    needs: [setup, generate-example]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest main branch built examples
        uses: actions/download-artifact@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          path: docs/src/examples
          pattern: example-*
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.setup.outputs.latest_docs_run }}
          merge-multiple: true

      - name: Overwrite examples with the ones built in this run
        uses: actions/download-artifact@v7
        with:
          path: docs/src/examples
          pattern: example-*
          merge-multiple: true

      - name: build documentation
        run: nox -e build_website

      - name: store documentation as github artifact to be downloaded by users
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/build/html/*
          overwrite: true  # only keep the latest version of the documentation

      - name: put documentation in the website
        run: |
          git clone https://github.com/$GITHUB_REPOSITORY --branch gh-pages gh-pages
          rm -rf gh-pages/.git
          cd gh-pages

          # deploys directly to the root of the website
          rm -rf *
          mv ../docs/build/html/* .

      - name: deploy to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_DEPLOY_TOKEN }}
          publish_dir: ./gh-pages/
          force_orphan: true
          cname: atomistic-cookbook.org
