channels:
  - metatensor
  - conda-forge
dependencies:
  - chemiscope
  # Single-precision OpenMPI build only. The broader mpi_* match also selects
  # double-precision packages that ship gmx_mpi_d instead of gmx_mpi.
  - metatensor::gromacs-metatomic=*=mpi_openmpi_h*
  # gromacs-metatomic links against flexible libblas/liblapack; default
  # libtorch/pytorch-cpu is compatible without a forced BLAS vendor pin.
  - libtorch
  - pytorch-cpu
  # TEMPORARY (see the pip pins below): libmetatensor 0.2.7 does not work with
  # libmetatensor-torch 0.10.8
  - libmetatensor <0.2.7
  - matplotlib
  - mdanalysis
  - python=3.12
  - pip
  - uv
  - pip:
    # Match published mta3 (libmetatomic-torch >=0.1.15, libtorch >=2.12).
    - torch>=2.12,<2.13
    - ase>=3.23
    - cmcrameri
    - metatrain>=2026.3
    - metatomic-torch>=0.1.16,<0.2
    - metatomic-ase
    - atomistic-cookbook-utils >=0.1,<0.2
    # TEMPORARY: the conda GROMACS is linked to libmetatensor-torch 0.10.8, and
    # cannot load models exported with metatensor-torch 0.10.9. Keep the pip
    # packages to the matching releases, and remove these pins (and
    # libmetatensor above) when libmetatensor-torch 0.10.9 is on conda-forge.
    - metatensor-torch <0.10.9
    - metatensor-operations <0.5.1
    - metatensor-core <0.2.7
