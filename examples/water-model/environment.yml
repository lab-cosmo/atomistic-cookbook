channels:
  - metatensor
  - conda-forge
dependencies:
  - python=3.12
  - lammps-metatomic
  - pip
  - pip:
    - ase
    - chemiscope>=1.0
    - ipi>=3.2.0
    # TEMPORARY: models exported with metatensor-torch 0.10.9 cannot be loaded
    # by the conda LAMMPS/PLUMED, linked to libmetatensor-torch 0.10.8. Remove
    # when libmetatensor-torch 0.10.9 is on conda-forge.
    - metatensor-torch>=0.10,<0.10.9
    - metatensor-operations
    - matplotlib
    - metatomic-torch
    - metatomic-ase
    - vesin>=0.5.4
    - vesin-torch>=0.5.4
    - torch-pme>=0.5
    - atomistic-cookbook-utils >=0.1,<0.2
