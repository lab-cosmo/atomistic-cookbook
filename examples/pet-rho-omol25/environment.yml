channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - ase >=3.23,<4
    - ipython >=8,<10
    - matplotlib >=3.8,<4
    - numpy >=1.26,<3
    - pandas >=2,<4
    - py3dmol >=2.4,<4
    - scikit-image >=0.22,<1
    # qpet is not on PyPI yet
    - qpet @ git+https://github.com/ppegolo/qpet.git@v0.1.0
