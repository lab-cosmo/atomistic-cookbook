channels:
  - metatensor
  - conda-forge
dependencies:
  - python==3.13
  - lammps-metatomic==2026.07.04.mta2
  - gromacs-metatomic=*=nompi*
  - pip
  - pip:
    - ase
    - metatrain>=2026.4.1
    - upet>=0.2.1
    - ipi>=3.1.8
    - matplotlib
    # deepmd-kit wheels are compiled against one exact torch version;
    # keep these two pins in sync. mpich provides the MPI library that
    # the deepmd-kit wheel loads at import time.
    - torch==2.10.*
    - deepmd-kit==3.1.3
    - mpich
    - metatomic_torchsim
    - mace-torch==0.3.14
