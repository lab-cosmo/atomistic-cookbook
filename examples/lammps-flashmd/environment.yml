channels:
  - metatensor
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - lammps-metatomic
  # TEMPORARY (see the pip pins below): libmetatensor 0.2.7 does not work with
  # libmetatensor-torch 0.10.8
  - libmetatensor <0.2.7
  - pip:
    - ase>=3.28
    - upet>=0.2.3
    - metatomic-torch
    - metatomic-ase
    - metatrain
    - vesin[torch]>=0.5.5
    - flashmd>=0.2.9
    - matplotlib
    - atomistic-cookbook-utils >=0.1,<0.2
    # TEMPORARY: the conda LAMMPS/PLUMED are linked to libmetatensor-torch
    # 0.10.8, and cannot load models exported with metatensor-torch 0.10.9.
    # Keep the pip packages to the matching releases, and remove these pins
    # (and libmetatensor above) when libmetatensor-torch 0.10.9 is on
    # conda-forge.
    - metatensor-torch <0.10.9
    - metatensor-operations <0.5.1
    - metatensor-core <0.2.7
