channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - lammps
  - pip:
    - ase>=3.29
    - chemiscope>=1.0
    # development version of i-PI, needed for the bulk_modulus option of the
    # barostat. To be replaced with the next i-PI release
    - ipi @ git+https://github.com/i-pi/i-pi.git@bugfix/barostats
    - matplotlib
    # q-TIP4P/f as a metatomic model, to run with the i-PI metatomic driver
    # (optional, see the recipe; not used to build the page)
    - metatomic-qtip4pf @ git+https://github.com/ceriottm/qtip4pf-test.git@996118759119307294e5165dbeb64b5eaef88ce6
    - vesin[torch]>=0.6,<0.7
