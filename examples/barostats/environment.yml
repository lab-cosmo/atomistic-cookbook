channels:
  - metatensor
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # no-MPI build (selected by the noxfile), that can also run metatomic models
  - lammps-metatomic==2026.07.04.mta2
  # TEMPORARY (see the pip pins below): libmetatensor 0.2.7 does not work with
  # libmetatensor-torch 0.10.8
  - libmetatensor <0.2.7
  - pip:
    - ase>=3.29
    - atomistic-cookbook-utils >=0.1,<0.2
    # TEMPORARY: the conda LAMMPS/PLUMED are linked to libmetatensor-torch
    # 0.10.8, and cannot load models exported with metatensor-torch 0.10.9.
    # Keep the pip packages to the matching releases, and remove these pins
    # (and libmetatensor above) when libmetatensor-torch 0.10.9 is on
    # conda-forge.
    - metatensor-torch <0.10.9
    - metatensor-operations <0.5.1
    - metatensor-core <0.2.7
    - chemiscope>=1.0
    # alpha release of i-PI 4.0, needed for the bulk_modulus option of the
    # barostat and for the torch backend
    - ipi>=4.0.0a1,<5
    - matplotlib
    # q-TIP4P/f as a metatomic model, to run with the i-PI metatomic driver
    # (only a short test run is performed when building the page)
    - metatomic-qtip4pf @ git+https://github.com/ceriottm/qtip4pf-test.git@main
    - vesin[torch]>=0.6,<0.7
