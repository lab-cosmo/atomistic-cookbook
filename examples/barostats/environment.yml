channels:
  - metatensor
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # no-MPI build (selected by the noxfile), that can also run metatomic models
  - lammps-metatomic==2026.07.04.mta2
  - pip:
    - ase>=3.29
    - atomistic-cookbook-utils >=0.1,<0.2
    - chemiscope>=1.0
    # development (next) branch of i-PI, needed for the bulk_modulus option of
    # the barostat and for the torch backend. To be replaced with the next
    # i-PI release
    - ipi @ git+https://github.com/i-pi/i-pi.git@next
    - matplotlib
    # q-TIP4P/f as a metatomic model, to run with the i-PI metatomic driver
    # (only a short test run is performed when building the page)
    - metatomic-qtip4pf @ git+https://github.com/ceriottm/qtip4pf-test.git@main
    - vesin[torch]>=0.6,<0.7
